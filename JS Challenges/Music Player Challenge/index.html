<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Listen to Lost in the City Lights and switch between tracks. A responsive music player built with HTML, CSS, and JavaScript for devChallenges.io."
    />
    <link
      rel="icon"
      href="resources/favicon.ico"
      type="image/x-icon"
      sizes="96x96"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <script src="./index.js" type="module" defer></script>
    <link rel="stylesheet" type="text/css" href="./main.css" />

    <title>Music Player | devChallenges.io</title>
  </head>
  <body>
    <main class="song" aria-label="Music Player">
      <div class="song__art-container">
        <img
          class="song__art"
          src="./resources/cover-city.jpg"
          alt="Album cover for Lost in the City Lights"
        />
      </div>
      <div class="song__article">
        <h1 class="song__title">Lost in the City Lights</h1>
        <p class="song__artist">Cosmo Sheldrake</p>
      </div>
      <div class="song__audio">
        <div class="timing__container">
          <p class="time-text">
            <time class="song__curr-time" datetime="PT0S">00:00</time>
          </p>
          <p class="time-text">
            <time class="song__duration" datetime="PT0S">00:00</time>
          </p>
        </div>
        <div class="seek">
          <div class="seek__fill"></div>
          <input type="range" min="0" value="0" aria-label="Seek" />
        </div>

        <audio>
          <source src="./resources/lost-in-city-lights.mp3" type="audio/mpeg" />
          <p>Fallback text if audio will not play</p>
        </audio>
      </div>
      <div class="song__player">
        <button class="icon-container song__prev" aria-label="Previous song">
          <img alt="" class="icon" src="./resources/prev_fill.svg" />
        </button>
        <button class="icon-container song__play-pause" aria-label="Play song">
          <img alt="" class="icon" src="./resources/play_fill.svg" />
        </button>
        <button class="icon-container song__next" aria-label="Next song">
          <img alt="" class="icon" src="./resources/next_fill.svg" />
        </button>
      </div>
    </main>
  </body>
</html>
